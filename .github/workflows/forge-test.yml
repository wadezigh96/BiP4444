name: Foundry tests

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forge-test:
    name: forge test (local only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install pinned forge-std dependency
        run: forge install foundry-rs/forge-std@v1.9.7 --no-git

      - name: Run unit tests
        run: forge test -vvv
