[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
# solc_version intentionally unset: Termux uses system solc (e.g. 0.8.35).
# On Linux CI, pin with: solc_version = "0.8.24" if desired.
optimizer = true
optimizer_runs = 200

fs_permissions = [{ access = "read", path = "./" }]

